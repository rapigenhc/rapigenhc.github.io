<!DOCTYPE html>

    <style>
        body { -webkit-tap-highlight-color: transparent; }
        
        details[open] summary ~ div {
            animation: sweep 0.4s ease-in-out;
        }
        @keyframes sweep {
            0%    { opacity: 0; transform: translateY(-10px); }
            100%  { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body data-package="암추적관리" class="bg-white text-gray-900 pb-32 overflow-x-hidden">

    <header class="bg-white/90 backdrop-blur-md sticky top-0 z-50 border-b border-gray-100">
        <div class="max-w-md md:max-w-4xl mx-auto px-5 h-14 md:h-16 flex items-center justify-between">
            <div class="flex items-center gap-3 cursor-pointer" onclick="location.href='index.html'">
                <svg class="w-6 h-6 text-gray-800" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M15 19l-7-7 7-7"></path></svg>
                <h1 class="text-[18px] md:text-[22px] font-black tracking-tight text-gray-900">래피젠 헬스케어 건강검진 이벤트</h1>
            </div>
            <button class="w-9 h-9 flex items-center justify-center rounded-full bg-gray-50 text-gray-600 hover:bg-gray-100 transition-colors" onclick="location.href='index.html'">

        </div>

    <main class="w-full flex flex-col items-center overflow-hidden pb-24">
        <section data-aos="fade-up" class="w-full max-w-5xl px-4 pt-16 pb-12 text-center flex flex-col items-center">
            <h4 class="text-[#F27405] font-bold text-xl md:text-2xl mb-2">암 생존자 추적관리 프로그램</h4>
            <h2 class="text-3xl md:text-4xl font-extrabold text-gray-900 break-keep leading-tight mb-4">
            치료 후가 관리의 시작입니다
            </h2>
            <p class="text-gray-600 text-sm md:text-base break-keep mb-8">
            증상이 없어도, 혈액에는 신호가 먼저 나타날 수 있습니다.<br class="hidden md:block"/>
            정기적인 추적관리 검사로 더 이른 시점에 파악하세요.
            </p>
            <div class="w-full max-w-4xl relative aspect-[16/9] rounded-3xl overflow-hidden shadow-sm bg-gray-100">
                <img src="survivor/main01.jpg" alt="의료진과 상담중인 환자" class="w-full h-full object-cover">
            </div>
        </section>

        <section class="w-full bg-white py-16">
            <div class="max-w-5xl mx-auto px-4">

                        아래 버튼을 통해 상담 신청하시면<br class="hidden md:block"/>
                        상담원이 전화를 드려 친절하게 안내해드립니다.
                    </h4>
                            
                    <div class="animate-bounce mt-2 text-orange-600">
                        <svg class="w-8 h-8 md:w-10 md:h-10 drop-shadow-sm" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M19 14l-7 7m0 0l-7-7m7 7V3"></path>
                        </svg>
                    </div>
                </div>
                
                <div data-aos="fade-up" data-aos-delay="100" class="mb-10 text-center md:text-center flex flex-col items-center">
                    <p><img src="img/intro-pic-v2.jpg" class="w-full"></p>
                    <p><img src="img/interior-pic-01.jpg" class="w-full"></p>
                    <p><img src="img/interior-pic-02.jpg" class="w-full"></p>
                    <p><img src="img/interior-pic-03.jpg" class="w-full"></p>
                    <p><img src="img/interior-pic-06.jpg" class="w-full"></p>
                    <p><a href="https://rapigenhc.com/" target="_blank"><img src="img/map-info.jpg" class="w-full"></a></p>

            </div>

    <div id="common-footer-container"></div>

    <div class="fixed bottom-24 z-[60] w-full max-w-md md:max-w-4xl left-1/2 -translate-x-1/2 pointer-events-none px-5">

            <div id="kakao-bubble" class="bg-white px-4 py-2 rounded-2xl shadow-xl border border-gray-100 relative animate-bounce-subtle">
                <p class="text-[13px] font-bold text-gray-800 flex items-center gap-1.5">
                    <span class="relative flex h-2 w-2">
                        <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-yellow-400 opacity-75"></span>
                        <span class="relative inline-flex rounded-full h-2 w-2 bg-yellow-500"></span>
                    </span>
                    <span id="bubble-text">빠른 채팅 상담하기</span>
                </p>
                <div class="absolute -bottom-1.5 right-4 w-3 h-3 bg-white border-r border-b border-gray-100 rotate-45"></div>
            </div>
            <a href="http://pf.kakao.com/_IHgin/chat" target="_blank" class="w-14 h-14 bg-[#FEE500] rounded-full shadow-2xl flex items-center justify-center hover:scale-110 active:scale-95 transition-all duration-300 ring-4 ring-white/50">
                <svg class="w-7 h-7 text-[#3A1D1D]" fill="currentColor" viewBox="0 0 24 24"><path d="M12 3c-4.97 0-9 3.185-9 7.115 0 2.553 1.71 4.795 4.305 6.054-.184.68-.664 2.45-.76 2.81-.12.45.152.445.32.332.132-.088 2.108-1.43 2.944-2.003.39.055.794.085 1.205.085 4.97 0 9-3.186 9-7.115S16.97 3 12 3z"/></svg>
